version: '3.9'

services:
  backend:
    build:
      context: ./backend 
    container_name: backend
    command: >
      sh -c "
        python manage.py makemigrations &&
        python manage.py migrate &&
        python manage.py runserver 0.0.0.0:8000
      "
    volumes:
      - ./backend:/app  
    ports:
      - "8000:8000"
    env_file:
      - backend/.env 
    depends_on:
      - db_postgres


  frontend:
    build:
      context: ./frontend 
    container_name: frontend
    volumes:
      - ./frontend:/app  
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
    restart: unless-stopped

  db_postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: shopping_db_2
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/

volumes:
  postgres_data:
